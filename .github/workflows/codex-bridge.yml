name: Codex Bridge

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  trigger-codex:
    name: Trigger Codex from approved task label
    runs-on: ubuntu-latest
    if: github.event.label.name == 'codex-ready'
    steps:
      - name: Post Codex task comment
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const labels = issue.labels.map((label) => label.name);
            const marker = '<!-- codex-bridge-trigger -->';
            const highRiskLabels = [
              'production-critical',
              'wallet',
              'ledger',
              'cash-in',
              'cash-out',
              'provider',
              'auth',
              'firebase-rules',
              'deployment'
            ];
            const hasHighRiskLabel = labels.some((label) => highRiskLabels.includes(label));
            const hasHumanApproval = labels.includes('codex-approved');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100
            });

            if (comments.some((comment) => comment.body && comment.body.includes(marker))) {
              core.info('Codex bridge comment already exists. Skipping duplicate trigger.');
              return;
            }

            if (hasHighRiskLabel && !hasHumanApproval) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `${marker}\nCodex bridge blocked this task because it has a high-risk label. Add the codex-approved label after human review if this task should run.`
              });
              return;
            }

            const body = (issue.body || '').slice(0, 6000);
            const taskType = issue.pull_request ? 'pull request' : 'issue';
            const comment = `${marker}\n@codex\n\nRun this Speedcash ${taskType} task.\n\nTitle: ${issue.title}\n\nURL: ${issue.html_url}\n\nInstructions:\n- Create or update one focused branch and pull request only.\n- Keep changes limited to the task body.\n- Do not broaden scope.\n- Add or update tests when code changes.\n- Run available checks and report results.\n- If the task touches high-risk payment, wallet, provider, auth, rule, or deployment areas, stop and ask for human approval.\n\nTask body:\n${body}`;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: comment
            });
